<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 210" width="310" height="210" role="img" aria-label="APPS: 4 apps I build for myself"><style>
text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes swing{0%{opacity:0;transform:translateY(34px) rotate(-3deg)}60%{opacity:1;transform:translateY(-5px) rotate(.6deg)}100%{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-24}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
.fb{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g style="animation:swing 0.9s cubic-bezier(.16,1,.3,1) 1.6s both" class="fb">
<rect width="310" height="210" rx="16" fill="#232c52" stroke="#C4BCB0" stroke-opacity=".3"/>
<text x="28" y="44" font-size="12" letter-spacing="3" fill="#9a9fb5">APPS</text>
<text x="28" y="128" font-size="84" font-weight="900" letter-spacing="-4" fill="#EEE8DF" opacity="0"><set attributeName="opacity" to="1" begin="2.10s" dur="0.14s"/>0</text><text x="28" y="128" font-size="84" font-weight="900" letter-spacing="-4" fill="#EEE8DF" opacity="0"><set attributeName="opacity" to="1" begin="2.24s" dur="0.14s"/>1</text><text x="28" y="128" font-size="84" font-weight="900" letter-spacing="-4" fill="#EEE8DF" opacity="0"><set attributeName="opacity" to="1" begin="2.38s" dur="0.14s"/>2</text><text x="28" y="128" font-size="84" font-weight="900" letter-spacing="-4" fill="#EEE8DF" opacity="0"><set attributeName="opacity" to="1" begin="2.52s" dur="0.14s"/>3</text><text x="28" y="128" font-size="84" font-weight="900" letter-spacing="-4" fill="#EEE8DF" opacity="0"><set attributeName="opacity" to="1" begin="2.66s" fill="freeze"/>4</text>
<text x="28" y="164" font-size="16" fill="#C4BCB0">apps I build for myself</text>
<circle cx="276" cy="34" r="5" fill="#C4BCB0"/><circle cx="276" cy="34" r="6" fill="none" stroke="#C4BCB0" stroke-width="2" style="transform-box:fill-box;transform-origin:center;animation:pop 1.8s ease-out 2.4000000000000004s infinite both"/>
<g style="animation:nudge 2.4s ease-in-out infinite"><path d="M258 176 L280 154 M264 154 H280 V170" stroke="#EEE8DF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
</g></svg>